name: CI

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cinema_ticketing_test
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cinema_ticketing_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    env:
      DATABASE_URL: postgres://postgres@localhost:5432/cinema_ticketing_test?sslmode=disable
      BOOKING_TEST_DATABASE_URL: postgres://postgres@localhost:5432/cinema_ticketing_test?sslmode=disable
      PAYMENT_TEST_DATABASE_URL: postgres://postgres@localhost:5432/cinema_ticketing_test?sslmode=disable
      STAFF_HTTP_TEST_DATABASE_URL: postgres://postgres@localhost:5432/staff_auth_http_test?sslmode=disable

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Check Go formatting
        run: |
          files=$(git ls-files '*.go')
          unformatted=$(gofmt -l $files)
          if [ -n "$unformatted" ]; then
            printf 'These Go files need gofmt:\n%s\n' "$unformatted"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Verify sqlc generated code
        run: |
          go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate
          changes=$(git status --porcelain --untracked-files=all)
          if [ -n "$changes" ]; then
            printf 'sqlc generation changed the checkout; commit regenerated files:\n%s\n' "$changes"
            exit 1
          fi

      - name: Apply database migrations
        run: go run ./cmd/migrate up

      - name: Prepare staff auth HTTP integration database
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE staff_auth_http_test'
          DATABASE_URL="$STAFF_HTTP_TEST_DATABASE_URL" go run ./cmd/migrate up

      - name: Run tests with race detection
        run: go test -race ./...
