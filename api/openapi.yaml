openapi: 3.1.1
info:
  title: Lumora Staff API
  version: 1.0.0
  description: HTTP contract for browser-facing staff authentication and management.
servers:
  - url: /
paths:
  /api/v1/staff/accounts:
    get:
      operationId: listStaffAccounts
      summary: Search and paginate staff accounts
      security:
        - staffSession: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: search
          in: query
          schema: { type: string, maxLength: 100 }
      responses:
        '200':
          description: Staff account page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffAccountPage'
        '400':
          description: Invalid pagination or search options
        '401':
          description: Missing or invalid staff session
        '403':
          description: The signed-in staff member is not a manager
    post:
      operationId: createStaffInvitation
      summary: Create a staff account invitation
      security:
        - staffSession: []
      parameters:
        - $ref: '#/components/parameters/StaffRequestHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, display_name, role]
              properties:
                email: { type: string, format: email }
                display_name: { type: string }
                role: { type: string, enum: [MANAGER, SCANNER] }
      responses:
        '202':
          description: Invitation email queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffInvitationResult' }
        '400': { description: Invalid invitation details }
        '401': { description: Missing or invalid staff session }
        '403': { description: Manager access or CSRF check failed }
        '409': { description: Email already belongs to a staff account }
  /api/v1/staff/accounts/{id}/invitation:
    post:
      operationId: resendStaffInvitation
      summary: Resend a pending staff invitation
      security:
        - staffSession: []
      parameters:
        - $ref: '#/components/parameters/StaffRequestHeader'
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '202':
          description: New invitation email queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffInvitationResult' }
        '401': { description: Missing or invalid staff session }
        '403': { description: Manager access or CSRF check failed }
        '404': { description: Pending invitation not found }
  /api/v1/staff/accounts/{id}/deactivation:
    post:
      operationId: deactivateStaffAccount
      summary: Deactivate a staff account
      security:
        - staffSession: []
      parameters:
        - $ref: '#/components/parameters/StaffRequestHeader'
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '204': { description: Staff account deactivated }
        '401': { description: Missing or invalid staff session }
        '403': { description: Manager access or CSRF check failed }
        '404': { description: Staff account not found }
        '409': { description: Self-deactivation or last active manager conflict }
  /api/v1/staff/auth/login:
    post:
      operationId: startStaffLogin
      summary: Verify staff password and begin MFA
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '200':
          description: MFA challenge created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffLoginChallenge'
        '400': { description: Invalid request }
        '401': { description: Invalid credentials }
        '429': { description: Login rate limit reached }
  /api/v1/staff/auth/mfa:
    post:
      operationId: completeStaffLogin
      summary: Complete MFA and set the staff session cookie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge, code]
              properties:
                challenge: { type: string }
                code: { type: string }
      responses:
        '200':
          description: Session established; response includes Set-Cookie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffLoginResult'
        '400': { description: Invalid request }
        '401': { description: Invalid or expired challenge }
  /api/v1/staff/auth/logout:
    post:
      operationId: logoutStaff
      summary: Revoke the current staff session
      security:
        - staffSession: []
      responses:
        '204': { description: Session revoked }
        '401': { description: Missing or invalid staff session }
        '403': { description: CSRF origin check failed }
  /api/v1/staff/auth/session:
    get:
      operationId: getStaffSession
      summary: Get the current authenticated staff identity
      security:
        - staffSession: []
      responses:
        '200':
          description: Current staff account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffSession'
        '401': { description: Missing or invalid staff session }
  /api/v1/staff/invitations/setup/start:
    post:
      operationId: startStaffEnrollment
      summary: Begin password and authenticator setup for an invited staff member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invitation_token]
              properties:
                invitation_token: { type: string }
      responses:
        '200':
          description: Enrollment challenge and authenticator secret
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffEnrollmentChallenge' }
        '400': { description: Invitation invalid or expired }
  /api/v1/staff/invitations/setup/complete:
    post:
      operationId: completeStaffEnrollment
      summary: Complete password and MFA setup for an invited staff member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invitation_token, challenge, password, code]
              properties:
                invitation_token: { type: string }
                challenge: { type: string }
                password: { type: string, format: password }
                code: { type: string, pattern: '^\\d{6}$' }
      responses:
        '200':
          description: Enrollment complete; recovery codes are returned once
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffEnrollmentResult' }
        '400': { description: Password or enrollment challenge invalid }
        '401': { description: Authenticator code invalid }
components:
  parameters:
    StaffRequestHeader:
      name: X-Staff-Request
      in: header
      required: true
      schema: { type: string, enum: ['1'] }
  securitySchemes:
    staffSession:
      type: apiKey
      in: cookie
      name: staff_session
  schemas:
    StaffLoginChallenge:
      type: object
      required: [challenge, purpose, expires_at]
      properties:
        challenge: { type: string }
        purpose: { type: string, enum: [MFA_SIGN_IN] }
        expires_at: { type: string, format: date-time }
    StaffIdentity:
      type: object
      required: [id, email, display_name, role]
      properties:
        id: { type: integer }
        email: { type: string, format: email }
        display_name: { type: string }
        role: { type: string, enum: [MANAGER, SCANNER] }
    StaffLoginResult:
      type: object
      required: [account, expires_at]
      properties:
        account: { $ref: '#/components/schemas/StaffIdentity' }
        expires_at: { type: string, format: date-time }
    StaffSession:
      type: object
      required: [account]
      properties:
        account: { $ref: '#/components/schemas/StaffIdentity' }
    StaffAccount:
      type: object
      required: [id, email, display_name, role, status, created_at]
      properties:
        id: { type: integer }
        email: { type: string, format: email }
        display_name: { type: string }
        role: { type: string, enum: [MANAGER, SCANNER] }
        status: { type: string, enum: [INVITED, ACTIVE, DISABLED] }
        created_at: { type: string, format: date-time }
    StaffAccountPage:
      type: object
      required: [accounts, page, page_size, has_more]
      properties:
        accounts:
          type: array
          items: { $ref: '#/components/schemas/StaffAccount' }
        page: { type: integer }
        page_size: { type: integer }
        has_more: { type: boolean }
    StaffInvitationResult:
      type: object
      required: [account, status]
      properties:
        account: { $ref: '#/components/schemas/StaffIdentity' }
        status: { type: string, enum: [INVITED] }
    StaffEnrollmentChallenge:
      type: object
      required: [challenge, totp_secret, expires_at]
      properties:
        challenge: { type: string }
        totp_secret: { type: string }
        expires_at: { type: string, format: date-time }
    StaffEnrollmentResult:
      type: object
      required: [account, recovery_codes]
      properties:
        account: { $ref: '#/components/schemas/StaffIdentity' }
        recovery_codes:
          type: array
          items: { type: string }
