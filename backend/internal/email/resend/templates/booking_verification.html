<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Your booking verification code</title>
  </head>
  <body style="margin: 0; padding: 0; background-color: #f3f8f7; color: #132b2a; font-family: Arial, Helvetica, sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background-color: #f3f8f7;">
      <tr>
        <td align="center" style="padding: 36px 16px;">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width: 560px;">
            <tr>
              <td style="padding: 0 0 20px;">
                <table role="presentation" cellspacing="0" cellpadding="0" border="0">
                  <tr>
                    <td width="38" height="38" align="center" valign="middle" style="width: 38px; height: 38px;"><img src="cid:lumora-mark" width="36" height="36" alt="Lumora" style="display: block; width: 36px; height: 36px; border: 0; border-radius: 8px;" /></td>
                    <td style="padding-left: 11px; color: #173331; font-size: 16px; font-weight: 700; letter-spacing: 0.04em;">LUMORA<br /><span style="color: #56716f; font-size: 10px; font-weight: 600; letter-spacing: 0.16em;">BOOKINGS</span></td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td style="padding: 32px; border: 1px solid #d7e4e2; border-radius: 12px; background-color: #ffffff;">
                <p style="margin: 0 0 10px; color: #52706d; font-size: 11px; font-weight: 700; letter-spacing: 0.16em;">BOOKING ACCESS</p>
                <h1 style="margin: 0; color: #132b2a; font-size: 24px; line-height: 1.3; font-weight: 700;">Confirm it’s you</h1>
                <p style="margin: 16px 0 0; color: #496461; font-size: 15px; line-height: 1.6;">Enter this code to verify access to your booking. It expires in {{.ExpiresIn}}.</p>
                <p style="margin: 22px 0; padding: 16px 12px; border-radius: 8px; background-color: #e8f3f1; color: #132b2a; font-family: 'Courier New', monospace; font-size: 30px; font-weight: 700; letter-spacing: 0.2em; text-align: center;">{{.Code}}</p>
                <p style="margin: 0; color: #6a807e; font-size: 12px; line-height: 1.6;">If you didn’t request a code, you can ignore this email. Your booking remains protected.</p>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding: 18px 8px 0; color: #708582; font-size: 11px; line-height: 1.5;">Lumora · Booking access</td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
