services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cinema_ticketing_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ./migrations/migration.sql:/docker-entrypoint-initdb.d/01-migration.sql:ro
      - ./migrations/webhooks.sql:/docker-entrypoint-initdb.d/02-webhooks.sql:ro
      - ./migrations/identity-defaults.sql:/docker-entrypoint-initdb.d/03-identity-defaults.sql:ro
      - ./migrations/04-screening-currency.sql:/docker-entrypoint-initdb.d/04-screening-currency.sql:ro
      - ./migrations/05-payment-initialization-receipts.sql:/docker-entrypoint-initdb.d/05-payment-initialization-receipts.sql:ro
      - ./migrations/06-booking-email-verification.sql:/docker-entrypoint-initdb.d/06-booking-email-verification.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cinema_ticketing_test"]
      interval: 2s
      timeout: 3s
      retries: 15
