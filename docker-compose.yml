name: lumora
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cinema_ticketing_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cinema_ticketing_test"]
      interval: 2s
      timeout: 3s
      retries: 15
